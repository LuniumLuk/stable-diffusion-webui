<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>SD Lite</title>
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body data-tab="text" class="booting">

<header id="topbar">
  <div class="brand">SD <span>Lite</span></div>
  <button id="modelChip" class="chip model-chip" type="button" title="Change checkpoint">loading…</button>
  <button id="btnSettings" class="icon-btn" type="button" aria-label="Settings">&#9881;</button>
</header>

<main id="screens">
  <section class="screen" id="screen-text" data-screen="text"></section>
  <section class="screen" id="screen-image" data-screen="image"></section>
  <section class="screen" id="screen-qwen" data-screen="qwen"></section>
  <section class="screen" id="screen-gallery" data-screen="gallery"></section>
  <section class="screen" id="screen-compose" data-screen="compose"></section>
</main>

<div id="jobstrip" hidden>
  <button id="jobPreview" class="job-preview" type="button" hidden><img id="jobPreviewImg" alt=""></button>
  <div class="job-meta">
    <div class="job-line">
      <span id="jobLabel">generating…</span>
      <span id="jobPercent" class="muted"></span>
    </div>
    <div class="job-bar"><div id="jobBarFill"></div></div>
    <div class="job-line small"><span id="jobDetail" class="muted"></span><span id="jobEta" class="muted"></span></div>
  </div>
  <button id="jobStop" class="stop-btn" type="button">&#9209;<span>Stop</span></button>
</div>

<nav id="tabbar">
  <button data-tab="text" type="button"><span class="tab-ico">&#9997;&#65039;</span><span>Text</span></button>
  <button data-tab="image" type="button"><span class="tab-ico">&#128444;&#65039;</span><span>Image</span></button>
  <button data-tab="qwen" type="button"><span class="tab-ico">&#127912;</span><span>Qwen</span></button>
  <button data-tab="gallery" type="button"><span class="tab-ico">&#128451;&#65039;</span><span>Gallery</span></button>
  <button data-tab="compose" type="button"><span class="tab-ico">&#129513;</span><span>Compose</span></button>
</nav>

<div id="sheetHost" hidden>
  <div id="sheetBackdrop"></div>
  <div id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div id="sheetTitle" class="sheet-title"></div>
      <button id="sheetClose" class="icon-btn" type="button" aria-label="Close">&#10005;</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
    <div id="sheetActions" class="sheet-actions" hidden></div>
  </div>
</div>

<div id="viewer" hidden>
  <div id="viewerTop">
    <button id="viewerClose" class="icon-btn" type="button" aria-label="Close">&#10005;</button>
    <div id="viewerTitle" class="viewer-title"></div>
  </div>
  <div id="viewerStage"><img id="viewerImg" alt=""></div>
  <div id="viewerBar"></div>
</div>

<div id="toasts"></div>

<template id="tpl-spinner"><span class="spinner"></span></template>

<script type="module" src="js/app.js"></script>
</body>
</html>

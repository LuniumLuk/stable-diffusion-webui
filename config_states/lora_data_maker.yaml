# lora_data_maker.yaml - panel randomization + sheet schemes.

# Randomize art style per panel?
#   true  -> each panel gets its own random style (weighted by the
#           optional 'weight' of every style entry).
#   false -> one uniform style for every panel (the FIRST entry).
# --style TAG on the command line overrides everything.
randomize_panel_style: true

# Add/remove styles freely; optional weight (default 1) biases how
# often a style is picked, e.g. weight: 3 -> picked ~3x as often.
styles:
  - tag: anime screencap
    text: "high-resolution anime style, soft cel shading, clean linework"
  - tag: anime movie style
    text: "modern anime movie style, painterly shading, soft gradients"
  - tag: retro 90s anime
    text: "retro 1990s anime style, thick bold lineart, flat cel shading"
  - tag: light novel illustration
    text: "light novel illustration style, delicate thin lineart, soft lighting"
  - tag: watercolor anime
    text: "watercolor anime style, gentle pastel colors, loose soft edges"
  - tag: vibrant flat anime
    text: "official anime production art, sharp linework, vibrant flat colors"
  - tag: detailed hatching
    text: "detailed ink hatching style, fine cross-hatched pen shading, bold outlines"
  - tag: plain flat colors
    text: "flat plain colors, minimal shading, clean simple coloring with bold shapes"
  - tag: vibrant saturated colors
    text: "vibrant saturated colors, high contrast, glowing highlights"
  - tag: monochrome grayscale
    text: "monochrome grayscale, elegant black and white ink with soft gray tones"
  - tag: pastel anime
    text: "soft pastel anime style, light airy colors, gentle blush shading"
  - tag: cute simplified anime
    text: "cute simplified anime style, big expressive eyes, clean simple shapes"
  - tag: shoujo manga style
    text: "classic shoujo manga style, large sparkling eyes, elegant thin lineart"
  - tag: shonen action style
    text: "dynamic shonen action style, bold speed-line shading, high energy"
  - tag: Makoto Shinkai style
    text: "in the style of Makoto Shinkai, luminous soft shading, dreamy lighting"
  - tag: Akira Toriyama style
    text: "in the style of Akira Toriyama, clean rounded lineart, bright cel shading"
  - tag: Naoko Takeuchi style
    text: "in the style of Naoko Takeuchi, elegant 90s shoujo art, sparkling eyes"
  - tag: Yoshitaka Amano style
    text: "in the style of Yoshitaka Amano, ethereal ink and watercolor, delicate lines"
  - tag: Vanripper style
    text: "in the style of Vanripper, clean bold lineart, dramatic rim lighting, high-contrast cel shading"
  - tag: Kantoku style
    text: "in the style of Kantoku, soft pastel colors, glossy detailed eyes, fine delicate shading"

# Randomize background scene per panel?
#   true  -> each panel gets its own random scene (weighted).
#   false -> panels stay on the plain white sheet.
randomize_panel_scene: true

# Scene entries may carry weight too. 'plain white background' is
# pre-configured with a raised weight so sheets stay mostly clean.
scenes:
  - tag: plain white background
    text: "background: plain solid white background, no props"
    weight: 8
  - tag: sunny park
    text: "background: a sunny public park with green lawn and trees"
  - tag: city street, daytime
    text: "background: a busy city street in daytime with shops and signs"
  - tag: city street, night
    text: "background: a quiet city street at night with warm streetlights"
  - tag: cozy cafe interior
    text: "background: a cozy cafe interior with wooden tables and warm tones"
  - tag: school classroom
    text: "background: a school classroom with desks and a blackboard"
  - tag: tidy bedroom
    text: "background: a tidy bedroom with a bed and soft window light"
  - tag: library
    text: "background: a library with tall bookshelves full of books"
  - tag: cherry blossom road
    text: "background: a road lined with blooming cherry trees, petals in the air"
  - tag: seaside
    text: "background: a sunny seaside with soft waves on the shore"
  - tag: mountain view
    text: "background: distant green mountains under a clear sky"
  - tag: starry night sky
    text: "background: a night sky full of stars"
  - tag: sunset sky
    text: "background: an orange and pink sunset sky"
  - tag: rainy street
    text: "background: a rainy street with puddle reflections"
  - tag: winter snow
    text: "background: a snowy winter street with falling snow"
  - tag: autumn park
    text: "background: an autumn park with red and gold leaves"
  - tag: soft gradient backdrop
    text: "background: a plain soft-colored gradient backdrop"
  - tag: rooftop at dusk
    text: "background: a rooftop at dusk with city lights below"
  - tag: traditional japanese room
    text: "background: a traditional Japanese room with tatami and sliding doors"

# Sheet schemes for the avatar picture(s). Each entry generates
# one grid. Change grid/aspect/size, or add more entries, e.g.
#   - grid: [3, 3]
#     aspect: "2:3"
#     size: "2K"
avatar_tasks:
  - grid: [3, 4]
    aspect: "3:4"
    size: "2K"
  - grid: [3, 3]
    aspect: "2:3"
    size: "2K"

# Sheet schemes for EVERY outfit fullbody picture. 'kind' is
# upper or fullbody; add entries to also generate e.g. a 2x4
# fullbody turnaround or a 3x3 upper grid.
outfit_tasks:
  - kind: upper
    grid: [3, 4]
    aspect: "3:4"
    size: "2K"
  - kind: upper
    grid: [3, 3]
    aspect: "2:3"
    size: "2K"
  - kind: fullbody
    grid: [3, 4]
    aspect: "3:4"
    size: "2K"
  - kind: fullbody
    grid: [3, 3]
    aspect: "2:3"
    size: "2K"

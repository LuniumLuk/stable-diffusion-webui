<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local LLM Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .container-main {
            display: flex;
            height: 100vh;
            gap: 0;
        }

        .sidebar {
            width: 280px;
            background: rgba(10, 10, 20, 0.8);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        .new-chat-btn {
            width: 100%;
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s;
        }

        .new-chat-btn:hover {
            background: #0b5ed7;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .conversation-item {
            padding: 10px 12px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            border-left: 3px solid transparent;
        }

        .conversation-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .conversation-item.active {
            background: rgba(13, 110, 253, 0.2);
            border-left-color: #0d6efd;
        }

        .delete-btn {
            float: right;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 12px;
            padding: 0 5px;
        }

        .delete-btn:hover {
            color: #ff6b6b;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #0f3460 0%, #1a1a2e 100%);
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            background: rgba(10, 10, 20, 0.5);
            font-weight: 600;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        /* markdown rendering inside assistant bubbles */
        .message.assistant .message-content {
            white-space: normal;
        }

        .message-content p { margin: 0 0 6px; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content pre {
            background: rgba(0,0,0,0.35);
            border-radius: 6px;
            padding: 10px 12px;
            overflow-x: auto;
            font-size: 13px;
            white-space: pre;
        }
        .message-content code {
            background: rgba(0,0,0,0.25);
            border-radius: 3px;
            padding: 1px 4px;
            font-size: 13px;
        }
        .message-content pre code {
            background: none;
            padding: 0;
        }
        .message-content ul, .message-content ol {
            margin: 4px 0 4px 20px;
            padding: 0;
        }
        .message-content li { margin-bottom: 2px; }
        .message-content h1, .message-content h2, .message-content h3 {
            font-size: 1em;
            font-weight: 700;
            margin: 6px 0 4px;
        }
        .message-content blockquote {
            border-left: 3px solid #555;
            margin: 4px 0;
            padding-left: 10px;
            color: #aaa;
                cursor: pointer;
                transition: background-color 0.15s ease, color 0.15s ease;
            }
            .message-content blockquote:hover {
                background: rgba(255, 255, 255, 0.05);
                color: #ddd;
            }
            .message-content blockquote.copied {
                background: rgba(25, 135, 84, 0.18);
                color: #e8fff2;
        }
        .message-content table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
            margin: 6px 0;
        }
        .message-content th, .message-content td {
            border: 1px solid #555;
            padding: 4px 8px;
            text-align: left;
        }
        .message-content hr {
            border: none;
            border-top: 1px solid #555;
            margin: 8px 0;
        }

        .message.user .message-content {
            background: #0d6efd;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: rgba(255, 255, 255, 0.1);
            border-left: 3px solid #0d6efd;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 20px;
            background: rgba(10, 10, 20, 0.8);
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            color: #eee;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            max-height: 120px;
        }

        .input-field:focus {
            outline: none;
            border-color: #0d6efd;
            background: rgba(255, 255, 255, 0.08);
        }

        .send-btn {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .send-btn:hover {
            background: #0b5ed7;
        }

        .send-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .status-bar {
            padding: 8px 20px;
            font-size: 12px;
            background: rgba(10, 10, 20, 0.9);
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .model-select {
            min-width: 260px;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #4c4c4c;
            color: #eee;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
        }

        .model-btn {
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .model-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-indicator.ready {
            background: #28a745;
            animation: pulse 2s infinite;
        }

        .status-indicator.loading {
            background: #ffc107;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .sidebar {
            scrollbar-width: thin;
        }

        .conversations-list {
            scrollbar-width: thin;
        }

        .messages-container {
            scrollbar-width: thin;
        }

        .empty-state {
            text-align: center;
            color: #999;
            margin-top: 40px;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container-main">
        <!-- Sidebar -->
        <div class="sidebar scrollbar-thin">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="newConversation()">+ New Chat</button>
            </div>
            <div class="conversations-list scrollbar-thin" id="conversationsList">
                <div class="empty-state">
                    <small>No conversations yet</small>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">Select a conversation or start a new chat</div>

            <div class="messages-container scrollbar-thin" id="messagesContainer">
                <div class="empty-state">
                    <h3>Welcome to Local LLM Chat</h3>
                    <p>Start a new conversation to begin chatting</p>
                </div>
            </div>

            <div class="input-area" id="inputArea" style="display: none;">
                <textarea class="input-field" id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
            </div>

            <div class="status-bar">
                <span id="statusText">
                    <span class="status-indicator loading"></span>
                    Loading...
                </span>
                <div class="status-right">
                    <span id="modelStatus">Model Status: Unknown</span>
                    <select id="modelSelect" class="model-select" title="Select loaded model"></select>
                    <button id="switchModelBtn" class="model-btn" onclick="switchModel()">Switch Model</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentConversation = null;
        let currentModelName = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkStatus();
            loadConversations();
            loadModelList();

            // Auto-expand textarea as user types
            const messageInput = document.getElementById('messageInput');
            const messagesContainer = document.getElementById('messagesContainer');
            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
            });

            // Send message on Ctrl+Enter
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && e.ctrlKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            messagesContainer.addEventListener('click', async (event) => {
                const quote = event.target.closest('.message.assistant .message-content blockquote');
                if (!quote) return;

                const quoteText = quote.innerText.trim();
                if (!quoteText) return;

                const copied = await copyTextToClipboard(quoteText);
                if (!copied) return;

                quote.classList.add('copied');
                window.setTimeout(() => quote.classList.remove('copied'), 700);
            });

            setInterval(checkStatus, 5000);
        });

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function copyTextToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }

                const temp = document.createElement('textarea');
                temp.value = text;
                temp.setAttribute('readonly', '');
                temp.style.position = 'absolute';
                temp.style.left = '-9999px';
                document.body.appendChild(temp);
                temp.select();
                const copied = document.execCommand('copy');
                document.body.removeChild(temp);
                return copied;
            } catch {
                return false;
            }
        }

        async function loadModelList(selectedName = null) {
            try {
                const response = await fetch('/api/models/list');
                const data = await response.json();
                const models = data.models || [];
                const activeModel = selectedName || data.current_model || currentModelName;

                const select = document.getElementById('modelSelect');
                select.innerHTML = '';

                if (models.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = 'No local .gguf model found';
                    select.appendChild(opt);
                    select.disabled = true;
                    document.getElementById('switchModelBtn').disabled = true;
                    return;
                }

                models.forEach((model) => {
                    const option = document.createElement('option');
                    option.value = model.name;
                    const sizeGB = model.size_bytes ? ` (${(model.size_bytes / (1024 ** 3)).toFixed(2)} GB)` : '';
                    option.textContent = `${model.name}${sizeGB}`;
                    select.appendChild(option);
                });

                if (activeModel) {
                    select.value = activeModel;
                }

                if (!select.value && models.length > 0) {
                    select.value = models[0].name;
                }

                currentModelName = select.value || activeModel;
                select.disabled = false;
                document.getElementById('switchModelBtn').disabled = false;
            } catch (e) {
                console.error('Failed to load models:', e);
            }
        }

        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.model_loaded) {
                    document.getElementById('statusText').innerHTML =
                        '<span class="status-indicator ready"></span>Ready';
                    const modelName = data.model_info?.model_name || 'Loaded ✓';
                    document.getElementById('modelStatus').textContent = `Model: ${modelName}`;
                    if (modelName && modelName !== currentModelName) {
                        currentModelName = modelName;
                        await loadModelList(modelName);
                    }
                } else {
                    document.getElementById('statusText').innerHTML =
                        '<span class="status-indicator loading"></span>Loading...';
                    document.getElementById('modelStatus').textContent = 'Model: Loading...';
                }
            } catch (e) {
                document.getElementById('statusText').innerHTML =
                    '<span class="status-indicator"></span>Error connecting';
            }
        }

        async function switchModel() {
            const select = document.getElementById('modelSelect');
            const switchBtn = document.getElementById('switchModelBtn');
            const selectedModel = (select.value || '').trim();

            if (!selectedModel) return;

            switchBtn.disabled = true;
            document.getElementById('modelStatus').textContent = `Switching model: ${selectedModel}...`;

            try {
                const response = await fetch('/api/models/select', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: selectedModel })
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Failed to switch model');
                }

                currentModelName = data.model_info?.model_name || selectedModel;
                document.getElementById('modelStatus').textContent = `Model: ${currentModelName}`;
                await loadModelList(currentModelName);
            } catch (e) {
                document.getElementById('modelStatus').textContent = `Model switch error: ${escapeHtml(e.message)}`;
            } finally {
                switchBtn.disabled = false;
            }
        }

        async function newConversation() {
            const response = await fetch('/api/chat/new', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: 'New Chat' })
            });

            const data = await response.json();
            currentConversation = data.conversation_id;

            document.getElementById('chatHeader').textContent = 'New Conversation';
            document.getElementById('messagesContainer').innerHTML = '';
            document.getElementById('inputArea').style.display = 'flex';

            loadConversations();
        }

        async function loadConversations() {
            const response = await fetch('/api/history/list');
            const conversations = await response.json();

            const list = document.getElementById('conversationsList');
            list.innerHTML = '';

            if (conversations.length === 0) {
                list.innerHTML = '<div class="empty-state"><small>No conversations yet</small></div>';
                return;
            }

            conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conversation-item';
                if (conv.id === currentConversation) item.classList.add('active');

                const title = conv.title || 'Untitled';
                const date = new Date(conv.updated_at).toLocaleDateString();

                item.innerHTML = `
                    <span onclick="loadConversation(${conv.id})" style="display: block; cursor: pointer;">
                        ${title}
                        <br><small style="opacity: 0.6;">${date}</small>
                    </span>
                    <button class="delete-btn" onclick="deleteConversation(event, ${conv.id})">✕</button>
                `;

                list.appendChild(item);
            });
        }

        async function loadConversation(convId) {
            currentConversation = convId;
            const response = await fetch(`/api/history/load/${convId}`);
            const data = await response.json();

            document.getElementById('chatHeader').textContent = 'Loaded Conversation';
            document.getElementById('inputArea').style.display = 'flex';

            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            data.messages.forEach(msg => {
                addMessageToUI(msg.role, msg.content);
            });

            loadConversations();
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            if (!currentConversation) {
                await newConversation();
            }

            document.getElementById('sendBtn').disabled = true;
            input.value = '';
            input.style.height = 'auto';

            addMessageToUI('user', message);

            try {
                const response = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (data.success) {
                    addMessageToUI('assistant', data.assistant_message);
                    if (data.auto_title) {
                        applyAutoTitle(currentConversation, data.auto_title);
                    }
                } else {
                    addMessageToUI('assistant', '❌ Error: ' + (data.error || 'Unknown error'));
                }
            } catch (e) {
                addMessageToUI('assistant', '❌ Connection error: ' + e.message);
            }

            document.getElementById('sendBtn').disabled = false;
            document.getElementById('messagesContainer').scrollTop =
                document.getElementById('messagesContainer').scrollHeight;
        }

        function applyAutoTitle(convId, title) {
            // Update header
            document.getElementById('chatHeader').textContent = title;
            // Update the sidebar item in-place, no full reload needed.
            const items = document.querySelectorAll('.conversation-item');
            items.forEach(item => {
                const span = item.querySelector('span[onclick]');
                if (span && item.querySelector(`[onclick*="loadConversation(${convId})"]`)) {
                    const small = span.querySelector('small');
                    span.childNodes[0].textContent = title + '\n';
                    // fallback: just reload list if DOM is tricky
                }
            });
            // Simple reload so sidebar date stays accurate.
            loadConversations();
        }

        function addMessageToUI(role, content) {
            const container = document.getElementById('messagesContainer');

            // Clear empty state
            if (container.querySelector('.empty-state')) {
                container.innerHTML = '';
            }

            const message = document.createElement('div');
            message.className = 'message ' + role;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            if (role === 'assistant' && typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
                // Render markdown; sanitize to prevent XSS.
                const raw = marked.parse(content || '');
                contentDiv.innerHTML = DOMPurify.sanitize(raw);
                contentDiv.querySelectorAll('blockquote').forEach((quote) => {
                    quote.title = 'Click to copy';
                });
            } else {
                contentDiv.textContent = content;
            }

            message.appendChild(contentDiv);
            container.appendChild(message);
        }

        async function deleteConversation(event, convId) {
            event.stopPropagation();

            if (!confirm('Delete this conversation?')) return;

            await fetch(`/api/history/delete/${convId}`, { method: 'DELETE' });

            if (currentConversation === convId) {
                currentConversation = null;
                document.getElementById('messagesContainer').innerHTML =
                    '<div class="empty-state"><h3>Welcome to Local LLM Chat</h3><p>Start a new conversation to begin chatting</p></div>';
                document.getElementById('inputArea').style.display = 'none';
            }

            loadConversations();
        }
    </script>
</body>
</html>
